<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sway</title>
<meta name="description" content="Tilt the box, not the ball. An iPhone puzzle game.">
<style>
  :root { --ink: #23201d; --quiet: #6b645d; --cloth: #f4efe8; --line: #e0d8cd; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #ece6de; --quiet: #a09890; --cloth: #1b1917; --line: #322e2a; }
  }
  :root[data-theme="dark"] { --ink: #ece6de; --quiet: #a09890; --cloth: #1b1917; --line: #322e2a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; min-height: 100vh; background: var(--cloth); color: var(--ink);
    font: 18px/1.6 ui-serif, Georgia, "Times New Roman", serif;
    display: grid; place-items: center;
  }
  main { max-width: 34rem; text-align: center; }
  h1 { font-size: clamp(2.6rem, 12vw, 4rem); margin: 0; letter-spacing: -.02em; }
  .tag { font-size: 1.15rem; margin: .4em 0 2.5em; }
  .tag em { font-style: italic; }
  p.body { text-align: left; color: var(--quiet); }
  footer { margin-top: 3em; padding-top: 1.25em; border-top: 1px solid var(--line); color: var(--quiet); font-size: .9rem; }
  a { color: inherit; text-underline-offset: 3px; }
</style>
</head>
<body>
<main>

  <h1>Sway</h1>
  <p class="tag">Tilt the box, <em>not the ball</em>.</p>

  <p class="body">A puzzle game for iPhone. The ball obeys the walls and its own
  momentum; you only decide which way the world leans. Every level is built
  rather than found, so the ladder never runs out.</p>

  <p class="body">Coming to the App Store.</p>

  <footer>
    <a href="privacy.html">Privacy policy</a> &middot;
    <a href="mailto:eirinibasiaka.dev@gmail.com">Contact</a><br>
    &copy; 2026 Eirini Basiaka
  </footer>

</main>
</body>
</html>
